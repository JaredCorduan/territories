<!doctype html>
<meta charset="utf-8">
<title>Zoo: animal pools</title>
<style>
  body { margin: 16px; background: #f6f5f2; color: #1d1d1f; font: 14px system-ui, sans-serif; --t: 48px; }
  @media (prefers-color-scheme: dark) { body { background: #17171a; color: #ececef; } }
  body.small { --t: 30px; }
  nav { display: flex; gap: 16px; align-items: center; margin-bottom: 8px; }
  button { font: inherit; padding: 6px 14px; cursor: pointer; }
  h2 { font-size: 15px; margin: 28px 0 10px; }
  .row { display: flex; gap: 18px; align-items: flex-start; margin-bottom: 14px; flex-wrap: wrap; }
  .label { width: 70px; padding-top: 6px; font-weight: 700; }
  .label small { display: block; font-weight: 400; opacity: 0.6; }
  .animal { width: calc(var(--t) * 2 + 4px); min-width: 78px; font-size: 11px; text-align: center; }
  .pair { display: flex; gap: 4px; justify-content: center; margin-bottom: 3px; }
  .cell { width: var(--t); height: var(--t); display: grid; place-items: center; }
  .cell img { width: 74%; height: 74%; }
  .cell.bold img { filter: invert(1); }
  .strip { display: flex; gap: 4px; }
</style>
<nav>
  <label><input id="small" type="checkbox"> Small tiles (about 10×10 board size)</label>
  <span style="opacity: 0.6">Each animal: normal tile, then solved tile.</span>
</nav>

<h2>Pools: one animal is drawn per color</h2>
<div id="pools"></div>

<h2>Example boards <button id="reroll">Reroll</button></h2>
<div id="samples"></div>

<script>
  // Reference page for choosing animals. A plain script with its own copy of the game's
  // pools and deepen() (the real ones are in web/common.js), so it opens from file://.
  // Pool entries are icons/ file names.
  const POOLS = [
    ['#d8604f', 'red', 'lorc_fox-head lorc_sad-crab lorc_scorpion delapouite_rooster delapouite_ladybug delapouite_ant delapouite_piranha'],
    ['#f0a04b', 'orange', 'delapouite_tiger-head delapouite_clownfish delapouite_squirrel delapouite_sea-star lorc_monkey delapouite_kangaroo delapouite_feline'],
    ['#efd66f', 'yellow', 'lorc_lion lorc_bee delapouite_duck delapouite_camel delapouite_labrador-head delapouite_toucan lorc_gold-scarab'],
    ['#a8c468', 'green', 'lorc_frog lorc_gecko lorc_snake darkzaitzev_chameleon-glyph lorc_dinosaur-rex delapouite_hummingbird caro-asercion_sloth'],
    ['#4fae9f', 'teal', 'lorc_turtle delapouite_manta-ray lorc_dragonfly lorc_angler-fish delapouite_swallow delapouite_seahorse delapouite_beaver'],
    ['#86b8ea', 'blue', 'delapouite_dolphin delapouite_sperm-whale delapouite_penguin delapouite_shark-fin caro-asercion_heron delapouite_juggling-seal lorc_butterfly'],
    ['#9670c0', 'purple', 'lorc_octopus delapouite_giant-squid lorc_jellyfish skoll_bat lorc_hanging-spider lorc_raven lorc_leeching-worm'],
    ['#f3a9cf', 'pink', 'skoll_pig delapouite_flamingo caro-asercion_axolotl delapouite_rabbit delapouite_shrimp lorc_snail lorc_mouse'],
    ['#e6e2d8', 'gray', 'lorc_wolf-head delapouite_elephant delapouite_rhinoceros-horn delapouite_sheep lorc_swan delapouite_panda delapouite_koala'],
    ['#94704e', 'brown', 'delapouite_bear-head delapouite_horse-head delapouite_gorilla delapouite_eagle-head caro-asercion_barn-owl lorc_stag-head caro-asercion_hedgehog'],
  ].map(([color, name, ids]) => ({ color, name, animals: ids.split(' ') }));

  function deepen(hex) {
    const [r, g, b] = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255);
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    const d = max - min;
    let h = 0;
    if (d) {
      if (max === r) h = ((g - b) / d) % 6;
      else if (max === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
    }
    const s = d ? d / (1 - Math.abs(max + min - 1)) : 0;
    const sat = d < 0.1 ? 0.06 : Math.min(1, s * 0.9 + 0.15);
    const light = Math.min(40, (max + min) * 50 - 16);
    return `hsl(${Math.round(h * 60 + 360) % 360} ${Math.round(sat * 100)}% ${Math.round(light)}%)`;
  }

  const $ = (id) => document.getElementById(id);
  const div = (cls, text = '') => {
    const el = document.createElement('div');
    el.className = cls;
    el.textContent = text;
    return el;
  };
  const short = (id) => id.split('_')[1];
  const cell = (color, id, bold) => {
    const el = div(`cell${bold ? ' bold' : ''}`);
    el.style.background = bold ? deepen(color) : color;
    el.title = short(id);
    el.append(Object.assign(new Image(), { src: `icons/${id}.svg` }));
    return el;
  };
  const animal = (color, id) => {
    const el = div('animal');
    const pair = div('pair');
    pair.append(cell(color, id, false), cell(color, id, true));
    el.append(pair, div('name', short(id)));
    return el;
  };

  for (const p of POOLS) {
    const row = div('row');
    const label = div('label', p.name);
    label.append(Object.assign(document.createElement('small'), { textContent: `${p.animals.length} animals` }));
    row.append(label, ...p.animals.map((id) => animal(p.color, id)));
    $('pools').append(row);
  }

  // Stand-in for the seeded pick: n of the 10 colors, then one animal from each.
  function samples() {
    $('samples').replaceChildren();
    const pick = (list) => list[Math.floor(Math.random() * list.length)];
    for (const n of [7, 8, 9, 10]) {
      for (let k = 0; k < 2; k++) {
        const pools = POOLS.map((p) => [Math.random(), p]).sort((a, b) => a[0] - b[0]).slice(0, n).map((x) => x[1]);
        const row = div('row');
        const strip = div('strip');
        const solved = div('strip');
        for (const p of pools) {
          const id = pick(p.animals);
          strip.append(cell(p.color, id, false));
          solved.append(cell(p.color, id, true));
        }
        row.append(div('label', k ? '' : `${n}×${n}`), strip, solved);
        $('samples').append(row);
      }
    }
  }
  $('reroll').onclick = samples;
  $('small').onchange = (e) => document.body.classList.toggle('small', e.target.checked);
  samples();
</script>
